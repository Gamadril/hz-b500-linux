# Private configuration loaded by cedar-headunit, without changing system defaults.
</usr/share/alsa/alsa.conf>

pcm.android_auto_mix {
    type dmix
    ipc_key 0x41415544
    ipc_key_add_uid true
    slave {
        pcm "hw:audiocodec,0"
        format S16_LE
        rate 48000
        channels 2
        # 320 ms in 20 ms periods (61440 bytes; the F133 codec DMA limit is 64 KiB).
        # dmix caps every client at this buffer, and
        # the one-core receiver stalls for tens of ms (80 ms underran audibly).
        period_size 960
        buffer_size 15360
    }
}

# Each AA channel opens this plug separately: ALSA converts 16 kHz mono
# speech/system PCM and mixes it with 48 kHz stereo media in one hardware PCM.
pcm.android_auto {
    type plug
    slave.pcm "android_auto_mix"
}
