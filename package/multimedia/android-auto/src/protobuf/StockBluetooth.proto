syntax = "proto2";
package androidauto.stock_bluetooth;

// AB5301B/F133 bootstrap dialect, separate from the BlueZ bootstrap schema.
message VersionRequest {
    optional uint32 major = 1;
    optional uint32 minor = 2;
    optional uint32 flags = 3;
    optional uint32 channel = 4;
}
message VersionResponse {
    optional uint32 major = 1;
    optional uint32 minor = 2;
    optional string serial = 3;
    optional int32 status = 4;
    optional uint32 channel = 5;
}
message NetworkInfo {
    optional string ssid = 1;
    optional string psk = 2;
    optional string mac_addr = 3;
    optional uint32 security_mode = 4;
}
message SocketInfoResponse {
    optional string ip_address = 1;
    optional uint32 port = 2;
    optional int32 status = 3;
}
